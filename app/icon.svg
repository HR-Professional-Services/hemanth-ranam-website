<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hrBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="hrTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  <!-- Outer squircle badge border matching header gradient -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#hrBorderGrad)" />
  <!-- Inner white background canvas matching header -->
  <rect x="8.5" y="8.5" width="83" height="83" rx="22" fill="#FFFFFF" />
  <!-- Bold HR Typography Monogram -->
  <text
    x="50"
    y="65"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="0.5"
    text-anchor="middle"
    fill="url(#hrTextGrad)"
  >HR</text>
</svg>
